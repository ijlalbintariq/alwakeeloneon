    <script>
      // Apply theme BEFORE React mounts to prevent a flash of light-theme on
      // first paint. Default is dark (the golden brand theme); switch to
      // light only when the user previously toggled or the OS prefers light
      // and they chose "system".
      (function () {
        try {
          var v = localStorage.getItem("alwakeelo-theme-v1");
          var isLight = v === "light" || (v === "system" && window.matchMedia &&
            !window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isLight) {
            document.documentElement.classList.add("light");
            document.documentElement.classList.remove("dark");
          }
          // else: leave class="dark" (golden theme) applied
        } catch (_) {
          /* localStorage blocked — keep default dark theme */
        }
      })();
    </script>

    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        transition: opacity 0.25s ease, visibility 0.25s ease;
        animation: splash-force-hide 0.01s linear 12s forwards;
      }
      #splash-screen.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .splash-glow-1 {
        position: absolute;
        top: -15%;
        left: -10%;
        width: 45%;
        height: 45%;
        background: rgba(245, 158, 11, 0.04);
        border-radius: 50%;
        filter: blur(120px);
      }
      .splash-glow-2 {
        position: absolute;
        bottom: -15%;
        right: -10%;
        width: 35%;
        height: 35%;
        background: rgba(245, 158, 11, 0.025);
        border-radius: 50%;
        filter: blur(100px);
      }
      .splash-icon-box {
        width: 5rem;
        height: 5rem;
        background: linear-gradient(135deg, #fbbf24, #d97706);
        border-radius: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(245, 158, 11, 0.2);
        animation: splash-icon-enter 0.8s ease-out both;
      }
      .splash-icon-box img {
        width: 3rem;
        height: 3rem;
        object-fit: contain;
      }
      .splash-title {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: -0.04em;
        font-style: italic;
        margin: 0;
        animation: splash-text-enter 0.8s 0.2s ease-out both;
      }
      .splash-tagline {
        font-family: 'Inter', sans-serif;
        font-size: 0.6rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        color: #475569;
        margin: 0;
        animation: splash-text-enter 0.8s 0.4s ease-out both;
      }
      .splash-loader {
        display: flex;
        gap: 0.4rem;
        animation: splash-text-enter 0.8s 0.6s ease-out both;
      }
      .splash-dot {
        width: 0.35rem;
        height: 0.35rem;
        border-radius: 50%;
        background: #f59e0b;
      }
      .splash-dot:nth-child(1) { animation: splash-bounce 1.2s 0.8s infinite; }
      .splash-dot:nth-child(2) { animation: splash-bounce 1.2s 1.0s infinite; }
      .splash-dot:nth-child(3) { animation: splash-bounce 1.2s 1.2s infinite; }
      .splash-secure {
        font-family: 'Inter', sans-serif;
        font-size: 0.5rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        color: #334155;
        margin: 0;
        animation: splash-text-enter 0.8s 0.8s ease-out both;
      }
      @keyframes splash-icon-enter {
        0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes splash-text-enter {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
      @keyframes splash-force-hide {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
    </style>
