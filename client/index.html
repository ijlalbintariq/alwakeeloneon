    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      #splash-screen.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .splash-glow-1 {
        position: absolute;
        top: -15%;
        left: -10%;
        width: 45%;
        height: 45%;
        background: rgba(245, 158, 11, 0.04);
        border-radius: 50%;
        filter: blur(120px);
      }
      .splash-glow-2 {
        position: absolute;
        bottom: -15%;
        right: -10%;
        width: 35%;
        height: 35%;
        background: rgba(245, 158, 11, 0.025);
        border-radius: 50%;
        filter: blur(100px);
      }
      .splash-icon-box {
        width: 5rem;
        height: 5rem;
        background: linear-gradient(135deg, #fbbf24, #d97706);
        border-radius: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(245, 158, 11, 0.2);
        animation: splash-icon-enter 0.8s ease-out both;
      }
      .splash-icon-box img {
        width: 3rem;
        height: 3rem;
        object-fit: contain;
      }
      .splash-title {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: -0.04em;
        font-style: italic;
        margin: 0;
        animation: splash-text-enter 0.8s 0.2s ease-out both;
      }
      .splash-tagline {
        font-family: 'Inter', sans-serif;
        font-size: 0.6rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        color: #475569;
        margin: 0;
        animation: splash-text-enter 0.8s 0.4s ease-out both;
      }
      .splash-loader {
        display: flex;
        gap: 0.4rem;
        animation: splash-text-enter 0.8s 0.6s ease-out both;
      }
      .splash-dot {
        width: 0.35rem;
        height: 0.35rem;
        border-radius: 50%;
        background: #f59e0b;
      }
      .splash-dot:nth-child(1) { animation: splash-bounce 1.2s 0.8s infinite; }
      .splash-dot:nth-child(2) { animation: splash-bounce 1.2s 1.0s infinite; }
      .splash-dot:nth-child(3) { animation: splash-bounce 1.2s 1.2s infinite; }
      .splash-secure {
        font-family: 'Inter', sans-serif;
        font-size: 0.5rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        color: #334155;
        margin: 0;
        animation: splash-text-enter 0.8s 0.8s ease-out both;
      }
      @keyframes splash-icon-enter {
        0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes splash-text-enter {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen" data-testid="splash-screen">
      <div class="splash-glow-1"></div>
      <div class="splash-glow-2"></div>
      <div class="splash-container">
        <div class="splash-icon-box">
          <img src="/logo.svg" alt="Al Wakeelo logo" />
        </div>
        <h1 class="splash-title">Al Wakeelo</h1>
        <p class="splash-tagline">Your Digital Lawyer, Always on Duty</p>
        <div class="splash-loader">
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
        </div>
        <p class="splash-secure">Initializing Secure Chambers</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
