services:
  - type: web
    name: alwakeelo-web
    env: docker
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: RAG_EMBEDDING_PROVIDER
        value: semantic
      - key: RAG_SEMANTIC_MODEL
        value: Xenova/paraphrase-multilingual-MiniLM-L12-v2
      - key: RAG_EMBEDDING_DIM
        value: "384"
      - key: RAG_INDEX_BATCH_SIZE
        value: "16"
      - key: CLOUD_OCR_PROVIDER
        value: ocrspace
      - key: OCRSPACE_API_KEY
        sync: false
      - key: CLOUD_OCR_TIMEOUT_MS
        value: "120000"
      - key: GITHUB_SYNC_ENABLED
        value: "false"
      - key: GITHUB_SYNC_AUTO_EXTRACT
        value: "false"
      - key: GITHUB_SYNC_BATCH_SIZE
        value: "2"
      - key: SAFEPAY_API_KEY
        sync: false
      - key: SAFEPAY_SECRET_KEY
        sync: false
      - key: SAFEPAY_ENVIRONMENT
        value: sandbox
      - key: SAFEPAY_WEBHOOK_SECRET
        sync: false
