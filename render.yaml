services:
  - type: web
    name: alwakeelo-web
    env: node
    plan: starter
    autoDeploy: true
    buildCommand: npm run build
    startCommand: node dist/index.cjs
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
    routes:
      - type: public
        domainType: default
